name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render
        run: |
          echo "Pinging Render at $(date -u)"
          curl --fail --location --silent --show-error \
            https://carbonstop-ai.onrender.com/health
          echo ""
          echo "Ping successful "